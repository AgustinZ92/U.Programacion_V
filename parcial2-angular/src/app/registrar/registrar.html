<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <div class="text-center mb-8">

      <h1 class="text-4xl font-bold text-white">
        Api Ricky
      </h1>

      <p class="text-slate-400 mt-2">
        Creá tu cuenta
      </p>

    </div>


    <div class="bg-white rounded-2xl shadow-2xl p-8">

      <h2 class="text-2xl font-bold text-slate-800 mb-6">
        Registrarse
      </h2>


      @if (errorMessage) {

        <div class="mb-5 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-red-700">
          {{ errorMessage }}
        </div>

      }


      <form
        [formGroup]="registerForm"
        (ngSubmit)="registrar()"
      >

        <div class="mb-4">

          <label class="block text-sm font-medium text-slate-700 mb-2">
            Nombre
          </label>

          <input
            type="text"
            formControlName="nombre"
            placeholder="Tu nombre"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500"
          >

        </div>


        <div class="mb-4">

          <label class="block text-sm font-medium text-slate-700 mb-2">
            Correo electrónico
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="ejemplo@gmail.com"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500"
          >

        </div>


        <div class="mb-4">

          <label class="block text-sm font-medium text-slate-700 mb-2">
            Contraseña
          </label>

          <input
            type="password"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500"
          >

        </div>


        <div class="mb-6">

          <label class="block text-sm font-medium text-slate-700 mb-2">
            Confirmar contraseña
          </label>

          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="Repetí tu contraseña"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500"
          >

        </div>


        <button
          type="submit"
          [disabled]="loading"
          class="w-full rounded-lg bg-blue-600 py-3 font-semibold text-white hover:bg-blue-700 disabled:opacity-50"
        >

          @if (loading) {
            Creando cuenta...
          } @else {
            Crear cuenta
          }

        </button>

      </form>


      <div class="text-center mt-6 pt-6 border-t">

        <p class="text-sm text-slate-500">
          ¿Ya tenés una cuenta?
        </p>

        <button
          type="button"
          (click)="irALogin()"
          class="mt-2 font-semibold text-blue-600 hover:text-blue-800"
        >
          Iniciar sesión
        </button>

      </div>

    </div>

  </div>

</div>
